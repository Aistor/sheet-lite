# 本地开发配置模板。
# 用法：复制为同目录下的 application-local.yml，再按本机环境修改。
# application-local.yml 已被 .gitignore 的 *local.yml 忽略，不会提交；
# 本文件不包含任何真实凭据。
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sheet_lite?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      register-mbeans: false

logging:
  level:
    com.example.sheetlite: DEBUG
    com.zaxxer.hikari: INFO

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
